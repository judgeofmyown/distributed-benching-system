<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Multi-Page App</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>

    <div class="global_container">
        <div class="orderbook">
            <div class="orderbook-col">
                <div class="col-title bids-title">Bids</div>
                <div class="table-header">
                    <span>Price</span>
                    <span>Qty</span>
                </div>
                <div id="bids-list" class="order-list bids-list"></div>

                <div class="orderbook-col">
                    <div class="col-title asks-title">Asks</div>
                    <div class="table-header">
                        <span>Price</span>
                        <span>Qty</span>
                    </div>
                    <div id="asks-list" class="order-list asks-list"></div>
                </div>
            </div>

            <div id="status" class="connection-status">Connecting to WebSocket...</div> 
        </div>

        <div class="bot_telemetry">
            <div id="metric">

            </div>
        </div>

    </div>
    
    
    <script type="module" src="src/js/app.js"></script>
    <script type="module" src="src/js/market_viewer.js"></script>
    <script type="module" src="src/js/telemetry.js"></script>
</body>
</html>
